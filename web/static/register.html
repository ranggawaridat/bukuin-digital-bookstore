<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daftar - Bukuin</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<header class="navbar">

    <a href="/" class="logo">
        BUKUIN.
    </a>

    <nav>
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a href="/login">Login</a>
    </nav>

</header>

<main class="auth-page">

    <section class="auth-card">

        <p class="eyebrow">
            JOIN BUKUIN
        </p>

        <h1>
            Buat Akun
        </h1>

        <p>
            Mulai perjalananmu bersama Bukuin.
        </p>

        <form id="register-form">

            <label>
                Nama
            </label>

            <input
                type="text"
                id="name"
                placeholder="Masukkan nama"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Masukkan email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                required
            >

            <button type="submit">
                Buat Akun
            </button>

        </form>

        <p id="message"></p>

        <p class="auth-link">
            Sudah punya akun?
            <a href="/login">
                Login
            </a>
        </p>

    </section>

</main>

<script src="/static/register.js"></script>


<script src="/static/app.js"></script>
</body>

</html>
