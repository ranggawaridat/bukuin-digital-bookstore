<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Katalog Buku - Bukuin</title>

    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages/style.css">

</head>

<body>

<div class="img_background">
    <img class="img_background-image" src="https://file.garden/aqn1gAHOnXqk_T7g/perpus_mobile%20(1).webp" alt="Background bookstore">
</div>

<header class="navbar">

    <a href="/" class="logo">
        BUKUIN.
    </a>

    <nav class="navbar-links" aria-label="Main menu">
        <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/books">Books</a></li>
            <li><a href="/admin">Admin</a></li>
            <li><a href="/login">Login</a></li>
        </ul>
    </nav>

</header>

<main class="catalog">

    <section class="catalog-header">

        <p class="eyebrow">
            DIGITAL BOOKSTORE
        </p>

        <h1>
            Temukan Buku
        </h1>

        <p>
            Jelajahi koleksi buku pilihan di Bukuin.
        </p>

        <div class="filters">

            <input
                type="text"
                id="search"
                placeholder="Cari buku atau penulis..."
            >

            <select id="category">

                <option value="">
                    Semua Kategori
                </option>

                <option value="Novel">
                    Novel
                </option>

                <option value="Filsafat">
                    Filsafat
                </option>

                <option value="Pengembangan Diri">
                    Pengembangan Diri
                </option>

            </select>

        </div>

    </section>

    <section
        id="book-list"
        class="book-grid"
    >

        <p>
            Loading books...
        </p>

    </section>

</main>

<script src="/static/js/books.js"></script>


<script src="/static/js/app.js"></script>
</body>

</html>
